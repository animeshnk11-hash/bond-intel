services:
  - type: web
    name: bond-intel
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn bond_intel.web.app:create_app --factory --app-dir src --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*" --no-access-log
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BI_WEB_PUBLIC
        value: "1"
      - key: BI_SESSION_SECRET
        generateValue: true
      - key: BI_DASHBOARD_DB_URL
        sync: false
