<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ status }} · Bond Intel</title><link rel="stylesheet" href="/static/app.css?v={{ asset_v('app.css') }}"></head>
<body><main style="max-width:560px;margin:80px auto"><div class="card">
<h2>{{ 'Not allowed' if status == 403 else 'Not found' if status == 404 else 'Something went wrong' }}</h2>
<p class="sub">{{ 'There is no page at this address.' if status == 404 and detail == 'Not Found' else (detail or '') }}</p><a class="btn" href="/">Back to the overview</a></div></main></body></html>
